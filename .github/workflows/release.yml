name: Release

# Push a tag like v0.1.0 to trigger a cross-platform build + GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
            # -nsis also produces an installer alongside the portable .exe.
            extra: "-nsis"
            files: |
              build/bin/rockion-windows-amd64.exe
              build/bin/rockion-windows-amd64-installer.exe
          - name: macos
            os: macos-latest
            platform: darwin/universal
            extra: ""
            files: build/bin/rockion-macos-universal.zip
          - name: linux
            os: ubuntu-22.04
            platform: linux/amd64
            extra: ""
            files: build/bin/rockion-linux-amd64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath ${{ matrix.extra }}

      - name: Package Windows artifacts
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          copy build\bin\rockion.exe build\bin\rockion-windows-amd64.exe
          copy build\bin\rockion-amd64-installer.exe build\bin\rockion-windows-amd64-installer.exe

      - name: Package macOS app
        if: matrix.name == 'macos'
        run: |
          cd build/bin
          ditto -c -k --keepParent rockion.app rockion-macos-universal.zip

      - name: Package Linux binary
        if: matrix.name == 'linux'
        run: |
          cd build/bin
          tar -czf rockion-linux-amd64.tar.gz rockion

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: ${{ matrix.files }}
