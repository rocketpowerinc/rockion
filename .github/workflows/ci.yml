name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.4"
  NODE_VERSION: "26.3.0"
  NPM_VERSION: "11.16.0"
  WAILS_VERSION: "v2.12.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Prepare embedded frontend directory
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Generate Wails bindings
        run: wails generate module -nocolour
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test Go
        run: go test -race -tags webkit2_41 ./...
      - name: Vet Go
        run: go vet -tags webkit2_41 ./...
      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 -tags webkit2_41 ./...
