name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.4"
  NODE_VERSION: "26.3.0"
  NPM_VERSION: "11.16.0"
  WAILS_VERSION: "v2.12.0"
  NSIS_VERSION: "3.12.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Prepare embedded frontend directory
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Generate Wails bindings
        run: wails generate module -nocolour
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test and vet Go
        run: |
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...
      - name: Verify tag matches release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const w=require('./wails.json'); if(w.info.productVersion !== '$version') process.exit(1)"
          grep -Fq "## [$version]" CHANGELOG.md

  build-native:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            platform: windows/amd64
            arch: amd64
            output: rockion-windows-amd64.exe
            build_args: "-nsis"
            artifact: rockion-windows-amd64
            files: |
              build/bin/rockion-windows-amd64.exe
              build/bin/rockion-windows-amd64-installer.exe
          - name: macos-apple-silicon
            os: macos-15
            platform: darwin/arm64
            arch: arm64
            output: Rockion
            build_args: ""
            artifact: rockion-macos-arm64
            files: build/bin/rockion-macos-arm64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install Windows packaging dependencies
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          choco install nsis --version="$env:NSIS_VERSION" -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          $makeNsis = Join-Path $nsisPath 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makeNsis)) {
            throw "NSIS was installed but makensis.exe was not found at $makeNsis"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added NSIS to PATH: $nsisPath"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath -o ${{ matrix.output }} ${{ matrix.build_args }}
      - name: Normalize Windows installer name
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/bin -Filter '*installer.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Wails did not produce an NSIS installer.'
          }
          $target = "build/bin/rockion-windows-${{ matrix.arch }}-installer.exe"
          Move-Item -LiteralPath $installer.FullName -Destination $target -Force
      - name: Sign Windows artifacts when credentials are configured
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = $env:WINDOWS_SIGNING_CERTIFICATE_BASE64
          $password = $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD
          if ([string]::IsNullOrWhiteSpace($certificate) -and [string]::IsNullOrWhiteSpace($password)) {
            Write-Host 'Windows signing credentials are not configured; artifacts remain unsigned.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($certificate) -or [string]::IsNullOrWhiteSpace($password)) {
            throw 'Both Windows signing secrets must be configured.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'rockion-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($certificate))
            Get-ChildItem build/bin -Filter 'rockion-windows-amd64*.exe' | ForEach-Object {
              & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /f $pfx /p $password $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed for $($_.Name)"
              }
              & signtool verify /pa /v $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signature verification failed for $($_.Name)"
              }
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Sign and notarize macOS app when credentials are configured
        if: startsWith(matrix.name, 'macos-')
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          values=(
            "$MACOS_SIGNING_CERTIFICATE_BASE64"
            "$MACOS_SIGNING_CERTIFICATE_PASSWORD"
            "$MACOS_SIGNING_IDENTITY"
            "$MACOS_NOTARY_APPLE_ID"
            "$MACOS_NOTARY_TEAM_ID"
            "$MACOS_NOTARY_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ $configured -eq 0 ]]; then
            echo 'macOS signing credentials are not configured; the app remains unsigned.'
            exit 0
          fi
          if [[ $configured -ne ${#values[@]} ]]; then
            echo 'All macOS signing and notarization secrets must be configured.' >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/rockion-signing.keychain-db"
          certificate="$RUNNER_TEMP/rockion-signing.p12"
          submission="$RUNNER_TEMP/rockion-notarization.zip"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$submission"
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | openssl base64 -d -A > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"

          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "build/bin/${{ matrix.output }}.app"
          codesign --verify --deep --strict --verbose=2 "build/bin/${{ matrix.output }}.app"
          ditto -c -k --keepParent "build/bin/${{ matrix.output }}.app" "$submission"
          xcrun notarytool submit "$submission" --wait \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD"
          xcrun stapler staple "build/bin/${{ matrix.output }}.app"
          xcrun stapler validate "build/bin/${{ matrix.output }}.app"
      - name: Package macOS app
        if: startsWith(matrix.name, 'macos-')
        run: |
          cd build/bin
          ditto -c -k --keepParent ${{ matrix.output }}.app ${{ matrix.artifact }}.zip
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  build-anduinos:
    name: Build AnduinOS package (amd64)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build Linux application
        run: wails build -platform linux/amd64 -clean -trimpath -tags webkit2_41 -o rockion
      - name: Verify AnduinOS linkage
        shell: bash
        run: |
          needed="$(readelf -d build/bin/rockion)"
          printf '%s\n' "$needed"
          grep -Fq 'libwebkit2gtk-4.1.so.0' <<<"$needed"
          if grep -Fq 'libwebkit2gtk-4.0.so.37' <<<"$needed"; then
            echo 'Rockion was linked against the unsupported WebKitGTK 4.0 ABI.' >&2
            exit 1
          fi
          links="$(ldd build/bin/rockion)"
          printf '%s\n' "$links"
          if grep -Fq 'not found' <<<"$links"; then
            echo 'Rockion has unresolved AnduinOS runtime dependencies.' >&2
            exit 1
          fi
      - name: Package AnduinOS application
        env:
          BINARY: build/bin/rockion
          OUTPUT: build/bin/rockion-anduinos-amd64.deb
        run: bash ./dev/linux/package-anduinos-deb.sh
      - name: Verify AnduinOS package metadata
        run: |
          dpkg-deb --info build/bin/rockion-anduinos-amd64.deb
          dpkg-deb --contents build/bin/rockion-anduinos-amd64.deb
          test "$(dpkg-deb -f build/bin/rockion-anduinos-amd64.deb Architecture)" = amd64
          test "$(dpkg-deb -f build/bin/rockion-anduinos-amd64.deb Package)" = rockion
      - name: Upload AnduinOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rockion-anduinos-amd64
          path: build/bin/rockion-anduinos-amd64.deb
          if-no-files-found: error
          retention-days: 7

  test-anduinos:
    name: Install and launch on AnduinOS baseline (amd64)
    needs: build-anduinos
    runs-on: ubuntu-24.04
    steps:
      - name: Download AnduinOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rockion-anduinos-amd64
          path: package
      - name: Install AnduinOS package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./package/rockion-anduinos-amd64.deb xvfb xauth
      - name: Launch Rockion
        shell: bash
        run: |
          binary="$(readlink -f "$(command -v rockion)")"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' rockion
          needed="$(readelf -d "$binary")"
          printf '%s\n' "$needed"
          grep -Fq 'libwebkit2gtk-4.1.so.0' <<<"$needed"
          if grep -Fq 'libwebkit2gtk-4.0.so.37' <<<"$needed"; then
            echo 'The installed package contains a WebKitGTK 4.0-linked binary.' >&2
            exit 1
          fi
          set +e
          timeout 15s xvfb-run -a rockion > rockion-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion failed its AnduinOS baseline startup test with status $status." >&2
            exit "$status"
          fi

  publish:
    name: Publish release
    needs:
      - build-native
      - build-anduinos
      - test-anduinos
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
