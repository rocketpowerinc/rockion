name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Prepare embedded frontend directory
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Generate Wails bindings
        run: wails generate module -nocolour
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test and vet Go
        run: |
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...
      - name: Verify tag matches release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const w=require('./wails.json'); if(w.info.productVersion !== '$version') process.exit(1)"
          grep -Fq "## [$version]" CHANGELOG.md

  build-native:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            platform: windows/amd64
            arch: amd64
            output: rockion-windows-amd64.exe
            build_args: "-nsis"
            artifact: rockion-windows-amd64
            files: |
              build/bin/rockion-windows-amd64.exe
              build/bin/rockion-windows-amd64-installer.exe
          - name: macos-apple-silicon
            os: macos-15
            platform: darwin/arm64
            arch: arm64
            output: rockion
            build_args: ""
            artifact: rockion-macos-arm64
            files: build/bin/rockion-macos-arm64.zip

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Windows packaging dependencies
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          $makeNsis = Join-Path $nsisPath 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makeNsis)) {
            throw "NSIS was installed but makensis.exe was not found at $makeNsis"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added NSIS to PATH: $nsisPath"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath -o ${{ matrix.output }} ${{ matrix.build_args }}
      - name: Normalize Windows installer name
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/bin -Filter '*installer.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Wails did not produce an NSIS installer.'
          }
          $target = "build/bin/rockion-windows-${{ matrix.arch }}-installer.exe"
          Move-Item -LiteralPath $installer.FullName -Destination $target -Force
      - name: Package macOS app
        if: startsWith(matrix.name, 'macos-')
        run: |
          cd build/bin
          ditto -c -k --keepParent rockion.app ${{ matrix.artifact }}.zip
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  build-debian:
    name: Build Debian 12 package (amd64)
    needs: verify
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Install action and build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev dpkg-dev
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build Linux application
        run: wails build -platform linux/amd64 -clean -trimpath -o rockion
      - name: Verify Debian linkage
        shell: bash
        run: |
          links="$(ldd build/bin/rockion)"
          printf '%s\n' "$links"
          grep -Fq 'libwebkit2gtk-4.0.so.37' <<<"$links"
          if grep -Fq 'not found' <<<"$links"; then
            echo 'Rockion has unresolved Debian runtime dependencies.' >&2
            exit 1
          fi
      - name: Package Debian application
        env:
          BINARY: build/bin/rockion
          OUTPUT: build/bin/rockion-linux-amd64.deb
        run: bash ./dev/linux/package-deb.sh
      - name: Verify Debian package metadata
        run: |
          dpkg-deb --info build/bin/rockion-linux-amd64.deb
          dpkg-deb --contents build/bin/rockion-linux-amd64.deb
          test "$(dpkg-deb -f build/bin/rockion-linux-amd64.deb Architecture)" = amd64
          test "$(dpkg-deb -f build/bin/rockion-linux-amd64.deb Package)" = rockion
      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rockion-linux-amd64
          path: build/bin/rockion-linux-amd64.deb
          if-no-files-found: error
          retention-days: 7

  test-debian:
    name: Install and launch on Debian 12 (amd64)
    needs: build-debian
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Install action prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rockion-linux-amd64
          path: package
      - name: Install Debian package
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ./package/rockion-linux-amd64.deb xvfb xauth passwd
          useradd --create-home --shell /bin/bash rockion-test
      - name: Launch Rockion
        shell: bash
        run: |
          set +e
          runuser -u rockion-test -- \
            timeout 15s xvfb-run -a rockion > rockion-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion failed its Debian 12 startup test with status $status." >&2
            exit "$status"
          fi

  publish:
    name: Publish release
    needs:
      - build-native
      - build-debian
      - test-debian
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
