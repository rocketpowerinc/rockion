name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Prepare embedded frontend directory
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Generate Wails bindings
        run: wails generate module -nocolour
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test and vet Go
        run: |
          go test -tags webkit2_41 ./...
          go vet -tags webkit2_41 ./...
      - name: Verify tag matches release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const w=require('./wails.json'); if(w.info.productVersion !== '$version') process.exit(1)"
          grep -Fq "## [$version]" CHANGELOG.md

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            platform: windows/amd64
            arch: amd64
            output: rockion-windows-amd64.exe
            build_args: "-nsis"
            artifact: rockion-windows-amd64
            files: |
              build/bin/rockion-windows-amd64.exe
              build/bin/rockion-windows-amd64-installer.exe
          - name: macos-apple-silicon
            os: macos-15
            platform: darwin/arm64
            arch: arm64
            output: rockion
            build_args: ""
            artifact: rockion-macos-arm64
            files: build/bin/rockion-macos-arm64.zip
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
            output: rockion-linux-amd64
            build_args: ""
            appimage: rockion-linux-x86_64.AppImage
            artifact: rockion-linux-x86_64
            files: build/bin/rockion-linux-x86_64.AppImage

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl file libgirepository1.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.0-dev patchelf python3 xauth xvfb
      - name: Install Windows packaging dependencies
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          $makeNsis = Join-Path $nsisPath 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makeNsis)) {
            throw "NSIS was installed but makensis.exe was not found at $makeNsis"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added NSIS to PATH: $nsisPath"
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath -o ${{ matrix.output }} ${{ matrix.build_args }}
      - name: Verify Linux build linkage
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          binary="build/bin/${{ matrix.output }}"
          links="$(ldd "$binary")"
          printf '%s\n' "$links"
          grep -Fq 'libwebkit2gtk-4.0.so.37' <<<"$links"
          if grep -Fq 'not found' <<<"$links"; then
            echo 'Linux binary has unresolved shared-library dependencies.' >&2
            exit 1
          fi
      - name: Smoke-test Linux build on Ubuntu 22.04
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          binary="build/bin/${{ matrix.output }}"
          set +e
          timeout 15s xvfb-run -a "$binary" > rockion-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion failed its Ubuntu 22.04 startup smoke test with status $status." >&2
            exit "$status"
          fi
      - name: Package Linux AppImage
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          BINARY: build/bin/${{ matrix.output }}
          OUTPUT: build/bin/${{ matrix.appimage }}
        run: bash ./dev/linux/package-appimage.sh
      - name: Verify Linux AppImage contents
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          image="build/bin/${{ matrix.appimage }}"
          chmod +x "$image"
          rm -rf squashfs-root
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/WebKitWebProcess
          test -x squashfs-root/usr/bin/WebKitNetworkProcess
          test -f squashfs-root/usr/lib/libwebkit2gtkinjectedbundle.so
          test -f squashfs-root/usr/lib/libfontconfig.so.1
          test -f squashfs-root/usr/lib/libfreetype.so.6
          test -f squashfs-root/usr/lib/libfribidi.so.0
          test -f squashfs-root/usr/lib/libharfbuzz.so.0
          find squashfs-root -name libwebkit2gtk-4.0.so.37 -print -quit | grep -q .

          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run -a "$image" > rockion-appimage-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-appimage-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion AppImage failed its Ubuntu 22.04 startup smoke test with status $status." >&2
            exit "$status"
          fi
      - name: Normalize Windows installer name
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/bin -Filter '*installer.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Wails did not produce an NSIS installer.'
          }
          $target = "build/bin/rockion-windows-${{ matrix.arch }}-installer.exe"
          Move-Item -LiteralPath $installer.FullName -Destination $target -Force
      - name: Package macOS app
        if: startsWith(matrix.name, 'macos-')
        run: |
          cd build/bin
          ditto -c -k --keepParent rockion.app ${{ matrix.artifact }}.zip
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  linux-compatibility:
    name: Test AppImage (ubuntu-26.04-x64)
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rockion-linux-x86_64
          path: package
      - name: Install AppImage smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 xauth xvfb
      - name: Verify and launch Linux AppImage
        shell: bash
        run: |
          image="package/rockion-linux-x86_64.AppImage"
          chmod +x "$image"
          rm -rf squashfs-root
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/WebKitWebProcess
          test -x squashfs-root/usr/bin/WebKitNetworkProcess
          test -f squashfs-root/usr/lib/libwebkit2gtkinjectedbundle.so
          test -f squashfs-root/usr/lib/libfontconfig.so.1
          test -f squashfs-root/usr/lib/libfreetype.so.6
          test -f squashfs-root/usr/lib/libfribidi.so.0
          test -f squashfs-root/usr/lib/libharfbuzz.so.0
          find squashfs-root -name libwebkit2gtk-4.0.so.37 -print -quit | grep -q .

          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run -a "$image" > rockion-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion failed its Ubuntu 26.04 startup smoke test with status $status." >&2
            exit "$status"
          fi

  publish:
    name: Publish release
    needs:
      - build
      - linux-compatibility
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
