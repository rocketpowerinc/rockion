name: AppImage preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: appimage-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppImage (linux-x64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils curl file libgirepository1.0-dev libgtk-3-dev \
            librsvg2-dev libwebkit2gtk-4.0-dev patchelf python3 xauth xvfb
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build Linux application
        run: wails build -platform linux/amd64 -clean -trimpath -o rockion-linux-amd64
      - name: Verify Linux build linkage
        shell: bash
        run: |
          binary="build/bin/rockion-linux-amd64"
          links="$(ldd "$binary")"
          printf '%s\n' "$links"
          grep -Fq 'libwebkit2gtk-4.0.so.37' <<<"$links"
          if grep -Fq 'not found' <<<"$links"; then
            echo 'Linux binary has unresolved shared-library dependencies.' >&2
            exit 1
          fi
      - name: Package Linux AppImage
        shell: bash
        env:
          ARCH: amd64
          BINARY: build/bin/rockion-linux-amd64
          OUTPUT: build/bin/rockion-linux-x86_64.AppImage
        run: bash ./dev/linux/package-appimage.sh
      - name: Verify and launch AppImage on Ubuntu 22.04
        shell: bash
        run: |
          image="build/bin/rockion-linux-x86_64.AppImage"
          chmod +x "$image"
          rm -rf squashfs-root
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/WebKitWebProcess
          test -x squashfs-root/usr/bin/WebKitNetworkProcess
          test -f squashfs-root/usr/lib/libwebkit2gtkinjectedbundle.so
          test -f squashfs-root/usr/lib/libfontconfig.so.1
          test -f squashfs-root/usr/lib/libfreetype.so.6
          test -f squashfs-root/usr/lib/libfribidi.so.0
          test -f squashfs-root/usr/lib/libharfbuzz.so.0
          find squashfs-root -name libwebkit2gtk-4.0.so.37 -print -quit | grep -q .

          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run -a "$image" > rockion-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion AppImage failed its Ubuntu 22.04 startup smoke test with status $status." >&2
            exit "$status"
          fi
      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rockion-linux-x86_64
          path: build/bin/rockion-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  ubuntu-compatibility:
    name: Test AppImage (ubuntu-26.04-x64)
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rockion-linux-x86_64
          path: package
      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 xauth xvfb
      - name: Launch AppImage
        shell: bash
        run: |
          image="package/rockion-linux-x86_64.AppImage"
          chmod +x "$image"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run -a "$image" > rockion-smoke.log 2>&1
          status=$?
          set -e
          cat rockion-smoke.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Rockion failed its Ubuntu 26.04 startup smoke test with status $status." >&2
            exit "$status"
          fi
